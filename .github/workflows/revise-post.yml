name: Revise blog draft

# Rewrites a blog-draft PR's post on its branch, from either:
# - a `/revise <what to change>` PR comment by the repo owner (public repo: nobody else may spend
#   the API key), or
# - workflow_dispatch with pr + instruction, sent by the Slack app's "Revise…" button (Cloudflare
#   Worker behind the Slack app, using a token only the owner holds).
# Afterwards it posts a fresh Slack message with Publish / Revise… / Reject buttons.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Draft PR number"
        type: string
        required: true
      instruction:
        description: "What to change"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write # approve (or start) pr-check on the branch

concurrency:
  group: revise-${{ github.event.issue.number || inputs.pr }}

jobs:
  revise:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/revise') &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.issue.labels.*.name, 'blog-draft'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || inputs.pr }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
    steps:
      - name: Find the draft branch
        id: pr
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::bad PR number: $PR"; exit 1; }
          read -r branch cross state label < <(gh pr view "$PR" -R "$GITHUB_REPOSITORY" \
            --json headRefName,isCrossRepository,state,labels \
            --jq '"\(.headRefName) \(.isCrossRepository) \(.state) \([.labels[].name] | index("blog-draft") != null)"')
          if [ "$cross" != "false" ] || [[ "$branch" != draft/* ]] || [ "$state" != OPEN ] || [ "$label" != true ]; then
            echo "::error::PR $PR is not an open blog-draft PR from this repo ($branch, $state)"; exit 1
          fi
          {
            echo "branch=$branch"
            echo "slug=${branch#draft/}"
            echo "url=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json url --jq .url)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.branch }}
      - uses: actions/checkout@v7
        with:
          ref: main
          path: .main
      - name: Use main's scripts, style guide and dependencies (the branch may be older)
        run: |
          rm -rf scripts && cp -r .main/scripts scripts
          cp .main/blog/STYLE.md blog/STYLE.md
          cp .main/package.json .main/package-lock.json .
          rm -rf .main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revise
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SLUG: ${{ steps.pr.outputs.slug }}
          COMMENT: ${{ github.event.comment.body }}
          DISPATCH_INSTRUCTION: ${{ inputs.instruction }}
          REVISE_OUT: ${{ runner.temp }}/revise.md
          REVISE_JSON: ${{ runner.temp }}/revise.json
        run: |
          if [ -n "$DISPATCH_INSTRUCTION" ]; then export INSTRUCTION="$DISPATCH_INSTRUCTION"; else export INSTRUCTION="${COMMENT#/revise}"; fi
          node scripts/draft/revise.mjs
      - name: Check
        run: |
          node scripts/check-posts.mjs --allow-verify
          npx astro check
          npm run build
      - name: Push and reply
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          SLUG: ${{ steps.pr.outputs.slug }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/content/posts/$SLUG.md"
          git commit -m "Revise draft per review"
          git push
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/revise.md"
          GITHUB_TOKEN="$GH_TOKEN" node scripts/draft/ensure-check.mjs "$BRANCH"
      - name: Tell Slack
        env:
          URL: ${{ steps.pr.outputs.url }}
        run: |
          j="$RUNNER_TEMP/revise.json"
          TITLE=$(jq -r .title "$j") WORDS=$(jq -r .words "$j") VERIFY=$(jq -r .verifyCount "$j") \
            NOTE="Revised: $(jq -r .summary "$j")" node scripts/draft/slack-message.mjs
      - name: Report failure
        if: failure()
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Revision failed: $RUN" || true
          MESSAGE=":warning: Revising <$RUN|draft PR #$PR> failed" node scripts/draft/notify.mjs || true
