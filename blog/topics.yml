# Blog topic backlog for the drafting workflow (.github/workflows/draft-post.yml).
# Used after Search Console near misses; the first topic without an earlier draft PR (open, merged
# or closed) is drafted. Draft PRs don't edit this file, so parallel drafts can't conflict on it.
# `angle` is optional guidance for the writer.
topics:
  - topic: "Web search for local LLMs with Ollama"
    angle: "Fully local stack: Ollama model + self-hosted Siftdog, no API keys."
  - topic: "Tavily API pricing vs self-hosting"
    angle: "Cost comparison with sourced Tavily prices; be fair about ops time and limits."
  - topic: "Turn web pages into clean text for RAG"
    angle: "Using /extract to get main content without boilerplate; limits (no JavaScript rendering)."
  - topic: "Crawl a documentation site into Markdown"
    angle: "Using /crawl and /map with path filters and depth limits."
  - topic: "Add web search to Claude Desktop with a self-hosted MCP server"
    angle: "claude_desktop_config.json with uvx siftdog mcp over stdio; the four tools; SEARXNG_URL only needed for search."
  - topic: "Migrating from Tavily to a self-hosted API: what changes"
    angle: "Honest checklist: change api_base_url, BM25 vs neural reranking, instructions/include_image_descriptions ignored, no /research endpoint."
  - topic: "Tavily search_depth basic vs advanced, explained"
    angle: "What advanced does in Siftdog: fetches each page, BM25-ranks chunks, chunks_per_source; speed vs quality trade-off."
  - topic: "Restrict AI agent web search to trusted domains"
    angle: "include_domains / exclude_domains for docs-only or allowlisted search; examples for coding agents."
  - topic: "Recent news search for LLM apps"
    angle: "topic=news and time_range on /search; good uses and limits (results depend on SearXNG engines)."
  - topic: "Generate answers from search results with include_answer"
    angle: "Siftdog writes the answer with Claude: ANTHROPIC_API_KEY, ANSWER_MODEL, ANSWER_EFFORT; when to skip it and let your own LLM answer."
  - topic: "Run a shared web search server for your team"
    angle: "Docker Compose on one server: API_KEYS, remote MCP at /mcp with MCP_ALLOWED_HOSTS, header vs ?api_key=. HTTPS proxy setup with sourced docs."
  - topic: "SSRF risks in AI agent tools that fetch URLs"
    angle: "Why /extract and /crawl-style tools are SSRF targets; redirects and DNS rebinding; how Siftdog blocks them; ALLOW_PRIVATE_NETWORKS only for trusted callers."
